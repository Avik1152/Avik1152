<svg width="900" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg {
      fill: #0f2027;
    }

    .title {
      font-family: monospace;
      font-size: 22px;
      fill: #00f7ff;
      filter: url(#glow);
    }

    .quote {
      font-family: monospace;
      font-size: 20px;
      fill: #39ff14;
      filter: url(#glow);
    }
  </style>

  <rect width="100%" height="100%" class="bg" rx="20"/>

  <text x="40" y="45" class="title">
    🚀 Day 1 of Building Intelligent Systems
  </text>

  <text x="40" y="95" class="quote">
    <tspan id="typingText"></tspan>
    <animate 
      xlink:href="#typingText"
      attributeName="textContent"
      from=""
      to="Code like an artist. Debug like a detective."
      dur="4s"
      fill="freeze" />
  </text>
</svg>
