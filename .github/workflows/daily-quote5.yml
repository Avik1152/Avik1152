name: Update Neon AI Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pick random quote
        id: quote
        run: |
          QUOTE=$(jq -r '.[]' quotes.json | shuf -n 1)
          DAY=$(git rev-list --count HEAD)
          echo "quote=$QUOTE" >> $GITHUB_OUTPUT
          echo "day=$DAY" >> $GITHUB_OUTPUT

      - name: Generate Neon Typing SVG
        run: |
          QUOTE="${{ steps.quote.outputs.quote }}"
          DAY="${{ steps.quote.outputs.day }}"

          cat <<EOF > dynamic-quote.svg
          <svg width="900" height="160" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <style>
              .bg {
                fill: #0f2027;
              }

              .title {
                font-family: monospace;
                font-size: 22px;
                fill: #00f7ff;
                filter: url(#glow);
              }

              .quote {
                font-family: monospace;
                font-size: 20px;
                fill: #39ff14;
                filter: url(#glow);
              }
            </style>

            <rect width="50%" height="50%" class="bg" rx="20"/>

            <text x="40" y="45" class="title">
              🚀 Day $DAY of Building Intelligent Systems
            </text>

            <text x="40" y="95" class="quote">
              <tspan id="typingText"></tspan>
              <animate 
                xlink:href="#typingText"
                attributeName="textContent"
                from=""
                to="$QUOTE"
                dur="4s"
                fill="freeze" />
            </text>
          </svg>
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dynamic-quote.svg
          git commit -m "⚡ Update Neon AI Quote" || echo "No changes"
          git push
