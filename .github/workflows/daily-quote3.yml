      - name: Create Dark & Light SVG
        run: |
          QUOTE="${{ steps.quote.outputs.quote }}"
          DAY="${{ steps.quote.outputs.day }}"

          # Dark Mode SVG
          cat <<EOF > dynamic-quote-dark.svg
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <style>
              .title { fill: #00f7ff; font-size: 20px; font-family: monospace; }
              .quote { fill: #ffffff; font-size: 18px; font-family: monospace; }
            </style>
            <rect width="100%" height="100%" fill="#0d1117" rx="15"/>
            <text x="20" y="35" class="title">
              Day $DAY of Building 🚀
            </text>
            <text x="20" y="70" class="quote">
              "$QUOTE"
            </text>
          </svg>
          EOF

          # Light Mode SVG
          cat <<EOF > dynamic-quote-light.svg
          <svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
            <style>
              .title { fill: #0a192f; font-size: 20px; font-family: monospace; }
              .quote { fill: #111111; font-size: 18px; font-family: monospace; }
            </style>
            <rect width="100%" height="100%" fill="#f6f8fa" rx="15"/>
            <text x="20" y="35" class="title">
              Day $DAY of Building 🚀
            </text>
            <text x="20" y="70" class="quote">
              "$QUOTE"
            </text>
          </svg>
          EOF
