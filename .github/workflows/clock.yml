name: Update Real-Time Clock

on:
  schedule:
    - cron: "*/1 * * * *"   # every 1 minute
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Clock SVG
        run: |
          TIME=$(TZ="Asia/Kolkata" date +"%H:%M:%S")
          DATE=$(TZ="Asia/Kolkata" date +"%d %b %Y")

          cat <<EOF > clock.svg
          <svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <style>
              .bg { fill: #0f2027; }
              .time {
                font-family: monospace;
                font-size: 36px;
                fill: #00f7ff;
                filter: url(#glow);
              }
              .date {
                font-family: monospace;
                font-size: 18px;
                fill: #39ff14;
                filter: url(#glow);
              }
            </style>

            <rect width="100%" height="100%" class="bg" rx="20"/>
            <text x="50%" y="55" text-anchor="middle" class="time">
              $TIME
            </text>
            <text x="50%" y="90" text-anchor="middle" class="date">
              $DATE | Asia/Kolkata
            </text>
          </svg>
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add clock.svg
          git commit -m "⏰ Update clock" || echo "No changes"
          git push
