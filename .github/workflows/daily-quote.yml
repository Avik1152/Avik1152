name: Update Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pick random quote
        id: quote
        run: |
          QUOTE=$(jq -r '.[]' quotes.json | shuf -n 1)
          echo "quote=$QUOTE" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          sed -i "/<!--QUOTE_START-->/, /<!--QUOTE_END-->/c\
          <!--QUOTE_START-->\n          ${{ steps.quote.outputs.quote }}\n          <!--QUOTE_END-->" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "🔄 Daily quote update" || echo "No changes"
          git push
