<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0f2027; }
    .time {
      font-family: monospace;
      font-size: 36px;
      fill: #00f7ff;
      filter: url(#glow);
    }
    .date {
      font-family: monospace;
      font-size: 18px;
      fill: #39ff14;
      filter: url(#glow);
    }
  </style>

  <rect width="100%" height="100%" class="bg" rx="20"/>
  <text x="50%" y="55" text-anchor="middle" class="time">
    16:20:24
  </text>
  <text x="50%" y="90" text-anchor="middle" class="date">
    06 Mar 2026 | Asia/Kolkata
  </text>
</svg>
