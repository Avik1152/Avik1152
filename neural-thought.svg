<svg width="900" height="170" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Neon Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing Reveal Mask -->
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="200" fill="white">
        <animate attributeName="width"
                 from="0"
                 to="900"
                 dur="4s"
                 fill="freeze" />
      </rect>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0f1c" rx="20"/>

  <!-- Title -->
  <text x="40" y="45"
        font-family="monospace"
        font-size="22"
        fill="#00f7ff"
        filter="url(#glow)">
    ⚡ Neural Thought Stream
  </text>

  <!-- Fixed Quote -->
  <text x="40" y="105"
        font-family="monospace"
        font-size="20"
        fill="#39ff14"
        filter="url(#glow)"
        mask="url(#reveal)">
    "AI doesn't replace developers. It upgrades them."
  </text>

</svg>
