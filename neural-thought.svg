<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Neon Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing Reveal Mask -->
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="120" fill="white">
        <animate attributeName="width"
                 from="0"
                 to="600"
                 dur="4s"
                 fill="freeze" />
      </rect>
    </mask>
  </defs>

  <!-- Black Background (No Border) -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Title -->
  <text x="30" y="45"
        font-family="monospace"
        font-size="22"
        fill="#00f7ff"
        filter="url(#glow)">
    Hi! 👋 I'm Avik
  </text>

  <!-- Quote -->
  <text x="30" y="85"
        font-family="monospace"
        font-size="18"
        fill="#39ff14"
        filter="url(#glow)"
        mask="url(#reveal)">
    Learning faster than yesterday’s version of me.
  </text>

</svg>
